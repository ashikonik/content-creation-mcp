[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-creation-mcp"
version = "1.2.0"
description = "Harness-agnostic MCP server exposing content-creation skills and agents over stdio and Streamable HTTP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "content-creation-mcp contributors" }]
keywords = ["mcp", "model-context-protocol", "content-creation", "video", "audio", "image"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Graphics",
]

# The runtime itself is stdlib-only: the build tooling uses PyYAML for
# frontmatter parsing in the authoring path, but the server's own index and
# provenance data are pre-generated JSON.
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/ashikonik/content-creation-mcp"
Repository = "https://github.com/ashikonik/content-creation-mcp"

[project.scripts]
content-creation-mcp-build-index = "build.build_index:main"
content-creation-mcp-build-provenance = "build.build_provenance:main"
content-creation-mcp-write-credits = "build.write_credits:main"

[tool.setuptools]
packages = ["build"]

[tool.setuptools.package-data]
build = ["*.py"]

# The generated index, the provenance table, the exclusion list and the
# harness registry are the build's inputs *and* the MCP server's runtime
# data. Without this, an installed wheel ships the scripts but none of the
# JSON they read, and every tool call fails on a missing index.
[tool.setuptools.data-files]
"share/content-creation-mcp/data" = [
  "data/index.json",
  "data/provenance.json",
  "data/excluded.json",
  "data/harnesses.json",
]
